apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wishlist
  template:
    metadata:
      labels:
        app: wishlist
    spec:
      containers:
        - name: wishlist
          image: ecommerce-microservices-k8s-wishlist:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1003
