services:
  ui:
    build: ./ui-web-app-reactjs
    ports:
      - 8080:8080

  zuul:
    build: ./zuul-api-gateway
    ports:
      - 9999:9999
    depends_on:
      - ui

  shoe:
    build: ./shoes-microservice-spring-boot # Changed to build from local source
    ports:
      - 1002:1002
    depends_on:
      - zuul

  offers:
    build: ./offers-microservice-spring-boot # Changed to build from local source 
    ports:
      - 1001:1001
    depends_on:
      - zuul

  cart:
    build: ./cart-microservice-nodejs # Changed to build from local source
    ports:
      - 1004:1004
    depends_on:
      - zuul

  wishlist:
    build: ./wishlist-microservice-python
    ports:
      - 1003:1003
    depends_on:
      - zuul