{{- range $name, $service := .Values.microservices }}
{{- if $service.autoscaling.enabled }}
---
# Horizontal Pod Autoscaler (HPA) for {{ $name }} microservice
# 
# HPA automatically scales the number of pods based on observed metrics:
# - CPU utilization
# - Memory utilization
# - Custom metrics (requests per second, queue length, etc.)
#
# Benefits:
# - Automatically handles traffic spikes
# - Reduces costs during low-traffic periods
# - Improves application availability
# - No manual intervention needed
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # Name of the HPA resource
  # Format: release-name-service-name
  name: {{ $.Release.Name }}-{{ $service.name }}
  
  # Labels for organizing and selecting resources
  labels:
    app: {{ $service.name }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    component: autoscaler
spec:
  # Reference to the resource to scale (Deployment)
  # The HPA will adjust the replicas of this deployment
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-{{ $service.name }}
  
  # Minimum number of replicas
  # HPA will never scale below this number
  # Ensures baseline availability even during low traffic
  # Recommended: At least 2 for high availability
  minReplicas: {{ $service.autoscaling.minReplicas }}
  
  # Maximum number of replicas
  # HPA will never scale above this number
  # Prevents runaway scaling and controls costs
  # Consider cluster capacity when setting this value
  maxReplicas: {{ $service.autoscaling.maxReplicas }}
  
  # Metrics used to determine when to scale
  # HPA evaluates all metrics and uses the one suggesting the highest replica count
  metrics:
  {{- if $service.autoscaling.targetCPUUtilizationPercentage }}
  # CPU-based scaling metric
  # Scales when average CPU usage across all pods exceeds target percentage
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # Target average CPU utilization across all pods
        # Example: 80 means scale up when CPU > 80%
        # Lower values = more responsive but may cause frequent scaling
        # Higher values = more efficient but may cause temporary slowness
        averageUtilization: {{ $service.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  
  {{- if $service.autoscaling.targetMemoryUtilizationPercentage }}
  # Memory-based scaling metric
  # Scales when average memory usage across all pods exceeds target percentage
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        # Target average memory utilization across all pods
        # Example: 80 means scale up when memory > 80%
        # Note: Memory scaling can be tricky due to GC behavior
        averageUtilization: {{ $service.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  
  # Scaling behavior controls how fast the HPA scales up or down
  # This prevents rapid fluctuations (flapping) and allows smooth scaling
  {{- if $service.autoscaling.behavior }}
  behavior:
    # Scale up behavior - how to handle increasing load
    scaleUp:
      # Stabilization window - wait this long before scaling up again
      # Prevents rapid scale-ups due to temporary spikes
      # Default: 0 seconds (immediate scale up)
      stabilizationWindowSeconds: {{ $service.autoscaling.behavior.scaleUp.stabilizationWindowSeconds | default 0 }}
      
      # Policies define the rate of scaling
      # HPA will select the policy that scales the most (within limits)
      policies:
      - type: Pods
        # Maximum number of pods to add in one scaling event
        # Example: 4 means add up to 4 pods at once
        value: {{ $service.autoscaling.behavior.scaleUp.policies.pods.value | default 4 }}
        # Time period for this policy
        # Example: 60 seconds means "add up to 4 pods per minute"
        periodSeconds: {{ $service.autoscaling.behavior.scaleUp.policies.pods.periodSeconds | default 60 }}
      
      - type: Percent
        # Maximum percentage increase in one scaling event
        # Example: 100 means double the current number of pods
        value: {{ $service.autoscaling.behavior.scaleUp.policies.percent.value | default 100 }}
        # Time period for this policy
        periodSeconds: {{ $service.autoscaling.behavior.scaleUp.policies.percent.periodSeconds | default 60 }}
      
      # Select policy - which policy to use when multiple apply
      # Options: Max (default), Min, Disabled
      # Max: Use the policy that adds the most pods
      selectPolicy: {{ $service.autoscaling.behavior.scaleUp.selectPolicy | default "Max" }}
    
    # Scale down behavior - how to handle decreasing load
    scaleDown:
      # Stabilization window - wait this long before scaling down
      # Prevents premature scale-down and pod churn
      # Default: 300 seconds (5 minutes)
      # Longer window = more stable but slower cost optimization
      stabilizationWindowSeconds: {{ $service.autoscaling.behavior.scaleDown.stabilizationWindowSeconds | default 300 }}
      
      policies:
      - type: Pods
        # Maximum number of pods to remove in one scaling event
        # Example: 1 means remove only 1 pod at a time
        # Conservative to prevent service disruption
        value: {{ $service.autoscaling.behavior.scaleDown.policies.pods.value | default 1 }}
        # Time period for this policy
        # Example: 60 seconds means "remove up to 1 pod per minute"
        periodSeconds: {{ $service.autoscaling.behavior.scaleDown.policies.pods.periodSeconds | default 60 }}
      
      - type: Percent
        # Maximum percentage decrease in one scaling event
        # Example: 10 means reduce by up to 10% of current pods
        value: {{ $service.autoscaling.behavior.scaleDown.policies.percent.value | default 10 }}
        periodSeconds: {{ $service.autoscaling.behavior.scaleDown.policies.percent.periodSeconds | default 60 }}
      
      # Select policy for scale down
      # Min: Use the policy that removes the fewest pods (safer)
      selectPolicy: {{ $service.autoscaling.behavior.scaleDown.selectPolicy | default "Min" }}
  {{- end }}

# How HPA Works:
# ==================
# 1. HPA queries metrics server every 15 seconds (default)
# 2. Calculates desired replicas: desiredReplicas = ceil[currentReplicas * (currentMetric / targetMetric)]
# 3. Applies scaling policies and behavior rules
# 4. Updates the Deployment's replica count
# 5. Kubernetes scheduler creates or terminates pods
#
# Example Calculation:
# - Current replicas: 2
# - Current CPU: 90%
# - Target CPU: 80%
# - Desired replicas = ceil[2 * (90/80)] = ceil[2.25] = 3 pods
#
# Prerequisites:
# ==================
# - Metrics Server must be installed: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# - Or for Minikube: minikube addons enable metrics-server
# - Resource requests must be defined in Deployment (CPU/Memory)
# - Without requests, HPA cannot calculate utilization percentage
#
# Verification:
# ==================
# Check HPA status:
#   kubectl get hpa
#   kubectl describe hpa {{ $.Release.Name }}-{{ $service.name }}
#
# Watch HPA in action:
#   kubectl get hpa -w
#
# Test autoscaling:
#   # Generate load with a load testing tool
#   kubectl run -i --tty load-generator --rm --image=busybox --restart=Never -- /bin/sh -c "while sleep 0.01; do wget -q -O- http://{{ $service.name }}:{{ $service.port }}/; done"
#
# Common Issues:
# ==================
# 1. "unable to get metrics" - Metrics server not installed or not ready
# 2. "missing request for cpu" - No resource requests defined in deployment
# 3. "failed to get cpu utilization" - Pod not ready or just started
# 4. Rapid scaling up/down - Adjust stabilization windows
{{- end }}
{{- end }}
