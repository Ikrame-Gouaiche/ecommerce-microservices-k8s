# Global settings
global:
  imagePullPolicy: IfNotPresent

# Define all 6 microservices
microservices:
  offers:
    enabled: true
    name: offers
    image:
      repository: ecommerce-microservices-k8s-offers
      tag: latest
    replicaCount: 1
    service:
      type: ClusterIP
      port: 1001
      targetPort: 1001
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    
  shoes:
    enabled: true
    name: shoes
    image:
      repository: ecommerce-microservices-k8s-shoes
      tag: latest
    replicaCount: 1
    service:
      type: ClusterIP
      port: 1002
      targetPort: 1002
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  
  wishlist:
    enabled: true
    name: wishlist
    image:
      repository: ecommerce-microservices-k8s-wishlist
      tag: latest
    replicaCount: 1
    service:
      type: ClusterIP
      port: 1003
      targetPort: 1003
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 150m
        memory: 128Mi
  
  cart:
    enabled: true
    name: cart
    image:
      repository: ecommerce-microservices-k8s-cart
      tag: latest
    replicaCount: 1
    service:
      type: ClusterIP
      port: 1004
      targetPort: 1004
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 150m
        memory: 128Mi
  
  zuul:
    enabled: true
    name: zuul
    image:
      repository: ecommerce-microservices-k8s-zuul
      tag: latest
    replicaCount: 1
    service:
      type: ClusterIP
      port: 9999
      targetPort: 9999
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  
  ui:
    enabled: true
    name: ui
    image:
      repository: ecommerce-microservices-k8s-ui
      tag: latest
    replicaCount: 1
    service:
      type: NodePort  # External access
      port: 8080
      targetPort: 8080
      nodePort: 30080  # Fixed port for easy access
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 150m
        memory: 128Mi